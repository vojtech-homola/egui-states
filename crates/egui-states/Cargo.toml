[package]
name = "egui_states"
version.workspace = true
edition.workspace = true
description = "Typed state synchronization between egui clients and Rust or Python servers"
documentation = "https://docs.rs/egui_states"
repository = "https://github.com/vojtech-homola/egui-states"
license = "MIT"
readme = "../../README.md"

[package.metadata.docs.rs]
features = ["rfd", "tls"]

[features]
default = ["client"]
client = ["dep:egui"]
# File dialogs for file transfers, through `rfd`.
rfd = ["client", "dep:rfd"]
server = ["tokio/macros", "dep:httparse", "dep:getrandom", "dep:crc32fast"]
python = [
    "tokio/macros",
    "dep:pyo3",
    "dep:httparse",
    "dep:getrandom",
    "dep:crc32fast",
    "tls",
]
# Encrypted connections (TLS) for the server and the native client.
tls = ["dep:tokio-rustls", "dep:rcgen", "dep:rustls-platform-verifier"]
# Exposes internals to the `egui_states_bench` benchmarks; not a public API.
bench = ["server", "client"]
build_scripts = ["client"]

[dependencies]
egui = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
# The browser `File` of a picked file needs `file-handle-inner`. rfd's
# default `wayland` feature is left out: it links the system Wayland library
# at build time and only attaches a dialog to its parent window on Wayland.
rfd = { version = "0.18", optional = true, default-features = false, features = [
    "xdg-portal",
    "file-handle-inner",
] }

postcard = { version = "1.1", features = ["use-std"] }
futures-util = "0.3"
parking_lot = { version = "0.13", features = ["arc_lock"] }
bytes = "1.11"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
event-listener = "5.4"

egui_states_macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", features = ["sync", "rt-multi-thread", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.30" }
# Saves received files relative to an open folder, so that no link in the
# folder can lead a file outside of it.
cap-std = "4.0"
httparse = { version = "1.10", optional = true }
# Tickets and zip checksums of browser downloads.
getrandom = { version = "0.4", optional = true }
crc32fast = { version = "1.5", optional = true }
# TLS. The `ring` backend is passed explicitly wherever rustls needs one, so
# the process-wide default provider is never installed or used.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
], optional = true }
# The server's certificate when none is supplied, created in memory.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "ring",
], optional = true }
# The native client's `Tls::System` mode: the operating system's trust store.
rustls-platform-verifier = { version = "0.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.52", features = ["sync", "macros"] }
ws_stream_wasm = { version = "0.7" }
# The close events of the browser socket, which carry the close code.
pharos = { version = "0.5" }
# The connection timeout's timer.
js-sys = { version = "0.3" }
wasm-bindgen-futures = { version = "0.4" }
web-sys = { workspace = true, features = [
    "Window",
    "Location",
    # File uploads and browser downloads.
    "Blob",
    "Document",
    "Element",
    "File",
    "HtmlAnchorElement",
    "HtmlElement",
    "Node",
] }
log = { version = "0.4" }
