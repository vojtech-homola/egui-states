# Generates include/egui_states.h. Regenerate it after changing the ABI with
#   EGUI_STATES_BLESS=1 cargo test -p egui_states_c --test header
language = "C"
cpp_compat = true
include_guard = "EGUI_STATES_H"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "type"
autogen_warning = "/* Generated by cbindgen from crates/egui-states-c; do not edit.\n * Regenerate with: EGUI_STATES_BLESS=1 cargo test -p egui_states_c --test header */"
header = """
/*
 * egui-states C ABI: a low-level gateway for egui-states servers written in
 * other languages.
 *
 * Status and errors
 *   Fallible functions return egui_states_status_t. On failure,
 *   egui_states_last_error() describes the error until the next failing call
 *   on the same thread.
 *
 * Lifecycle
 *   Create a server, define types, register every state, call
 *   egui_states_server_finalize, subscribe to events, then start it. States
 *   are named by their full dotted path ("root.settings.count") and typed by
 *   Rust type strings ("Vec<Option<Point>>"); both must match the Rust client.
 *   A header generated by egui_states::build_scripts::generate_c does the
 *   registration for you.
 *
 * Values
 *   Values are written with an egui_states_writer_t and read with an
 *   egui_states_reader_t, in declaration order. Structs, tuples, fixed-size
 *   arrays, and () have no header: write and read their fields in order.
 *   Option is a presence flag before the value, Vec and HashMap a count before
 *   the elements or key/value pairs, and enums their variant index.
 *
 * Events
 *   Client changes are polled with egui_states_server_wait_event. An event
 *   holds a claim on its state until it is freed, so changes of one state are
 *   handled one at a time even with several waiting threads.
 *
 * Ownership and threading
 *   Handles are created by *_new functions and released by *_free functions,
 *   which ignore null. Input pointers are borrowed only during the call;
 *   buffers with a zero length may be null. Server functions are thread-safe,
 *   except egui_states_server_free, which must not run concurrently with any
 *   other call on that server. Writers, readers, and events may move between
 *   threads but must not be used by two threads at once.
 *
 * Copying out
 *   Functions that copy into a caller buffer always report the required size.
 *   A null buffer with zero capacity only asks for it; a smaller buffer
 *   returns EGUI_STATES_ERROR_BUFFER_TOO_SMALL. Strings are copied with a
 *   terminating NUL that the reported length excludes.
 *
 * Blocking
 *   While a client is connected, Data, DataMulti, Image, ImageMulti, and take
 *   operations may block until the state's previous transfer is acknowledged
 *   or the client disconnects.
 */"""

after_includes = """

/* String length meaning that the string is NUL-terminated (SIZE_MAX). */
#define EGUI_STATES_NUL_TERMINATED SIZE_MAX"""

[export]
include = ["egui_states_image_t"]
# usize::MAX has no cbindgen spelling; `after_includes` defines it.
exclude = ["EGUI_STATES_NUL_TERMINATED"]

[enum]
rename_variants = "None"
