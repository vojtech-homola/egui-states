[package]
name = "egui_states_c"
version.workspace = true
edition.workspace = true
description = "C ABI for the egui-states server"
license = "MIT"
publish = false

[lib]
name = "egui_states_c"
# `rlib` lets the integration tests call the exported functions directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# A path dependency: `workspace = true` cannot turn off default features here.
egui_states = { path = "../egui-states", default-features = false, features = ["c_abi"] }

[dev-dependencies]
egui_states = { path = "../egui-states", features = ["c_abi", "client"] }
cbindgen = { version = "0.29", default-features = false }
egui = { workspace = true }
