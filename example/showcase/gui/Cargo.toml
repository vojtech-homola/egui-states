[package]
publish = false
name = "showcase_gui"
version.workspace = true
edition.workspace = true
description = "Native and WebAssembly feature showcase"

[[bin]]
name = "showcase-gui"
path = "main.rs"

[dependencies]
showcase_gui_core = { path = "../gui-core" }
eframe = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
web-sys = { workspace = true }

[build-dependencies]
egui_states = { workspace = true, features = ["build_scripts"] }
showcase_gui_core = { path = "../gui-core" }
