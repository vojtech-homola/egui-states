[build]
target = "./example/showcase/gui/index.html"
dist = "./example/showcase/gui/web/"
filehash = false

[serve]
port = 8090

[watch]
watch = ["./example/showcase/gui-core/", "./example/showcase/gui/", "./crates/egui-states/src/client/"]
ignore = ["./example/showcase/gui/web/"]

# The browser client connects back to the page's own origin. Forward its
# WebSocket to the showcase server, as if the server had served the page.
[[proxy]]
backend = "ws://127.0.0.1:8091/ws"
ws = true
