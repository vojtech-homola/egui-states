[workspace]
members = [
    "crates/egui-states",
    "crates/egui-states-macros",
    "crates/egui-states-python",

    "example/showcase/gui-core",
    "example/showcase/gui",
    "example/showcase/rust",
    "example/counter/gui",
    "example/counter/rust",
    "tests/shared-test-states",
    "tests/rust-integration",
    "tests/rust-process-helpers",
    "example/tests/rust"
]
# Library development defaults; Python and example packages remain opt-in.
default-members = [
    "crates/egui-states",
    "crates/egui-states-macros",
    "tests/rust-integration",
    "tests/rust-process-helpers"
]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"

[workspace.dependencies]
egui_states_macros = { path = "crates/egui-states-macros" }
egui_states = { path = "crates/egui-states" }
pyo3 = "0.30"
egui = "0.37"
eframe = "0.37"
tokio = "1.52"
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = "0.3"
