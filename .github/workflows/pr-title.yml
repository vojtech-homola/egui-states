name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on
# `main`, and git-cliff silently drops messages that are not Conventional
# Commits. Only the title is read, so `pull_request_target` is safe here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Changelog groups from `[tool.git-cliff]` in pyproject.toml, plus
          # the skipped `chore` and `ci`.
          types: |
            feat
            fix
            refactor
            doc
            perf
            change
            style
            test
            revert
            chore
            ci
