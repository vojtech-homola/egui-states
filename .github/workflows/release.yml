name: Release

# Merging the `chore: release X.Y.Z` pull request opened by the Prepare release
# workflow publishes that release: the wheels and the sdist are built and
# tested, the commit is tagged, the files go to PyPI, and a GitHub release is
# created. docs/releasing.md describes the whole procedure.
#
# A manual run from the Actions tab is a dry run on any branch: it builds and
# tests the wheels without publishing anything. With `publish` ticked on `main`
# it publishes the current commit instead, which retries a release whose
# pull request is already merged.
on:
  push:
    branches: [main]
    # A release commit changes Cargo.toml, or CHANGELOG.md when it refreshes a
    # release that was prepared but never published.
    paths: [Cargo.toml, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release prepared on main (leave off for a dry run)
        type: boolean
        default: false

concurrency:
  # Per commit: a queued run replaces the run already waiting in its group, so
  # a shared group would let an unrelated push cancel a waiting release.
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHONS: 3.12 3.13 3.14 3.14t 3.15 3.15t
  GIT_CLIFF_VERSION: 2.14.2

jobs:
  prepare:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # `publish`, `dry-run`, or `skip` for a push that is not a release.
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag and changelog checks need the history and the tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - name: Decide what to do
        id: mode
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mode=dry-run
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # Squash-merging the release pull request gives this subject,
            # followed by the pull request number.
            subject="${MESSAGE%%$'\n'*}"
            if [[ "$subject" == "chore: release $VERSION" || "$subject" == "chore: release $VERSION "* ]]; then
              mode=publish
            else
              mode=skip
              echo "Nothing to publish: \`$subject\` is not the release commit of $VERSION." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$PUBLISH" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Publish from main, not $GITHUB_REF."
              exit 1
            fi
            mode=publish
          fi
          if [[ "$mode" == publish ]]; then
            # A tag on this very commit is a rerun of a release that failed
            # after tagging; anywhere else the version is already released.
            tagged=$(git rev-parse --quiet --verify "refs/tags/$VERSION^{commit}" || true)
            if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::Version $VERSION is already tagged on $tagged; run Prepare release for the next version."
              exit 1
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          extract() {
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$1"
          }
          extract CHANGELOG.md > release-notes.md
          # The section must list every commit of the release. It goes stale
          # when something is merged after the release was prepared, and it is
          # missing when the version was bumped by hand.
          if [[ "$MODE" == publish ]]; then
            uvx "git-cliff@$GIT_CLIFF_VERSION" --tag "$VERSION" --output "$RUNNER_TEMP/generated.md"
            extract "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/generated-notes.md"
            if ! diff -u release-notes.md "$RUNNER_TEMP/generated-notes.md"; then
              echo "::error::CHANGELOG.md does not match the commits of $VERSION. Run Prepare release again and merge its pull request."
              exit 1
            fi
          fi
          # A release of only `chore` and `ci` commits has no changelog section.
          if [[ ! -s release-notes.md ]]; then
            echo "Maintenance release without user-facing changes." > release-notes.md
          fi
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  wheels-linux:
    name: Wheels (linux ${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64, runner: ubuntu-latest }
          - { target: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - id: interpreters
        run: echo "args=$(printf 'python%s ' $PYTHONS)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist --compression-level 9 --interpreter ${{ steps.interpreters.outputs.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/*.whl

  wheels-native:
    name: Wheels (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { name: windows-x64, runner: windows-latest }
          - { name: macos-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build wheels
        shell: bash
        run: |
          for python in $PYTHONS; do
            uv build --wheel --out-dir dist --python "$python" -C maturin.build-args="--compression-level 9"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  check-dist:
    name: Check distribution set
    needs: [prepare, wheels-linux, wheels-native, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Expect one wheel per platform and interpreter
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l dist
          expected=1
          missing=0
          for python in $PYTHONS; do
            abi="cp${python//[.t]/}"
            tag="$abi-$abi${python//[0-9.]/}"
            for platform in manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64 'macosx_*_arm64'; do
              expected=$((expected + 1))
              if ! compgen -G "dist/egui_states-$VERSION-$tag-$platform.whl" > /dev/null; then
                echo "::error::Missing wheel for $tag on $platform."
                missing=1
              fi
            done
          done
          [[ -f "dist/egui_states-$VERSION.tar.gz" ]] || { echo "::error::Missing sdist."; missing=1; }
          actual=$(ls dist | wc -l)
          if [[ "$actual" -ne "$expected" ]]; then
            echo "::error::Expected $expected files in dist, found $actual."
            missing=1
          fi
          exit "$missing"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  smoke-test:
    name: Smoke test (${{ matrix.runner }})
    needs: [prepare, check-dist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install and import each wheel
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for python in $PYTHONS; do
            echo "::group::Python $python"
            venv="smoke-$python"
            uv venv --python "$python" "$venv"
            uv pip install --python "$venv" numpy
            uv pip install --python "$venv" --no-index --find-links dist "egui-states==$VERSION"
            interpreter="$venv/bin/python"
            [[ -x "$interpreter" ]] || interpreter="$venv/Scripts/python.exe"
            "$interpreter" -c 'import sys, egui_states; assert egui_states.__version__ == sys.argv[1], egui_states.__version__' "$VERSION"
            echo "::endgroup::"
          done

  # The tag comes before PyPI: an upload cannot be undone, so everything that
  # can still fail runs first. GITHUB_TOKEN may create tags only if the `tags`
  # ruleset does not restrict creation (see docs/releasing.md).
  tag:
    name: Tag the release
    needs: [prepare, smoke-test]
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Lists the tags that start with the version, so the lookup of a
          # missing tag is an empty list instead of an error.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/$VERSION\") | .object.sha")
          if [[ "$existing" == "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION already points at $GITHUB_SHA."
          elif [[ -n "$existing" ]]; then
            echo "::error::Tag $VERSION already exists and does not point at $GITHUB_SHA."
            exit 1
          elif gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" --silent; then
            echo "Tagged $GITHUB_SHA as $VERSION."
          else
            echo "::error::Could not create tag $VERSION; nothing was published. On a repository rule violation, let GitHub Actions create tags (docs/releasing.md), then re-run the failed jobs."
            exit 1
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, tag]
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/egui-states/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
